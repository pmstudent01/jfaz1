$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |
      const qaWorkshopPackage = pm.require('@postvehicle-enterprise-team-d8d8a5ee-2fdf-4848-b0f5-5b921790/qa_workshop_package');
      const jsonData = pm.response.json();

      pm.test("VIN is valid", function () {
          pm.expect(qaWorkshopPackage.isValidVIN(jsonData.vehicle.vin)).to.be.true;
      });

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
    packages:
      "@postvehicle-enterprise-team-d8d8a5ee-2fdf-4848-b0f5-5b921790/qa_workshop_package":
        id: 01a1a2b7-972a-7448-91d7-dfc1e176dc42
order: 2000
